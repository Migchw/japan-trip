<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🇯🇵 Japan Trip 2026 - รวมภาพรีวิวจริง 71 ร้านอาหาร & สถานที่ท่องเที่ยว (พร้อม 11 พิกัดมัทฉะ Uji)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A365D;
            --primary-light: #2B6CB0;
            --accent: #E53E3E;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #2D3748;
            --text-sub: #718096;
            --border: #E2E8F0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 80px;
        }
        header {
            background: linear-gradient(135deg, #1A365D 0%, #2B6CB0 100%);
            color: white;
            padding: 30px 16px 22px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }
        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        header p {
            font-size: 0.95rem;
            opacity: 0.92;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.45;
        }
        .container {
            max-width: 1480px;
            margin: -16px auto 0;
            padding: 0 14px;
        }
        .controls-card {
            background: white;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15);
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.95rem;
        }
        .filter-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 2px;
        }
        .filter-btn {
            padding: 7px 14px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: #EDF2F7;
        }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .view-toggle {
            display: flex;
            background: #EDF2F7;
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
        }
        .toggle-btn {
            padding: 6px 12px;
            border: none;
            background: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* GRID VIEW */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        @media (max-width: 480px) {
            .grid-view {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.45rem;
            }
            header p {
                font-size: 0.88rem;
            }
            .controls-card {
                padding: 12px;
            }
        }
        .place-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid #E2E8F0;
        }
        .place-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.1);
        }
        .card-main-img-wrapper {
            width: 100%;
            height: 200px;
            position: relative;
            background: #EDF2F7;
            cursor: pointer;
            overflow: hidden;
        }
        .card-main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .card-main-img-wrapper:hover .card-main-img {
            transform: scale(1.03);
        }
        .badge-city {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(26, 54, 93, 0.9);
            backdrop-filter: blur(4px);
            color: white;
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .badge-type {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.94);
            color: var(--text-main);
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .card-thumbs-strip {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            background: #F8FAFC;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: thin;
        }
        .card-thumb-item {
            width: 65px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .card-thumb-item:hover {
            border-color: var(--primary-light);
            transform: scale(1.05);
        }
        .card-thumb-item.active {
            border-color: var(--accent);
        }
        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-area {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 3px;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.35;
            margin-bottom: 6px;
        }
        .card-cuisine {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .card-hours {
            font-size: 0.8rem;
            background: #EDF2F7;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            color: #4A5568;
            display: inline-block;
        }
        .card-signature {
            font-size: 0.85rem;
            line-height: 1.45;
            color: #2D3748;
            background: #FFF5F5;
            border-left: 3px solid var(--accent);
            padding: 7px 10px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 10px;
            flex: 1;
        }
        .card-signature strong {
            color: var(--accent);
        }
        .card-note {
            font-size: 0.82rem;
            background: #FEFCBF;
            color: #744210;
            padding: 5px 9px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .card-footer {
            display: flex;
            gap: 6px;
            margin-top: auto;
            border-top: 1px solid #EDF2F7;
            padding-top: 10px;
        }
        .btn-maps {
            flex: 1;
            padding: 8px;
            background: var(--primary);
            color: white;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .btn-maps:hover {
            background: var(--primary-light);
        }
        .btn-reviews {
            padding: 8px 10px;
            background: #EDF2F7;
            color: #4A5568;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: background 0.2s;
        }

        /* TABLE VIEW */
        .table-view {
            display: none;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.86rem;
            text-align: left;
        }
        th {
            background: var(--primary);
            color: white;
            padding: 12px 10px;
            font-weight: 600;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:hover td {
            background: #F8FAFC;
        }
        .tbl-photos-cell {
            display: flex;
            gap: 5px;
            align-items: center;
            min-width: 250px;
        }
        .tbl-photo-item {
            width: 70px;
            height: 52px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border: 1px solid #CBD5E0;
            flex-shrink: 0;
        }
        .tbl-photo-item:hover {
            transform: scale(1.1);
            z-index: 5;
        }
        .tbl-badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .badge-tokyo { background: #EBF8FF; color: #2B6CB0; }
        .badge-osaka { background: #FEFCBF; color: #975A16; }
        .badge-kyoto { background: #FEEBC8; color: #C05621; }
        .badge-yamanashi { background: #E6FFFA; color: #234E52; }

        /* LIGHTBOX MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            max-width: 95vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 34px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>🇯🇵 Japan Trip 2026</h1>
        <p>รวมภาพรีวิวจริง 60 ร้านอาหาร & จุดเช็คอินในโตเกียว โอซาก้า เกียวโต</p>
    </header>

    <div class="container">
        <div class="controls-card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อร้าน, ย่าน (เช่น Ginza, Namba) หรือเมนู...">
            </div>
            
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterCity('all', this)">ทั้งหมด (71)</button>
                <button class="filter-btn" onclick="filterCity('Tokyo', this)">🗼 โตเกียว (24)</button>
                <button class="filter-btn" onclick="filterCity('Osaka', this)">🐙 โอซาก้า (29)</button>
                <button class="filter-btn" onclick="filterCity('Kyoto', this)">⛩️ เกียวโต (17)</button>
                <button class="filter-btn" onclick="filterCity('Yamanashi', this)">🗻 ยามานาชิ (1)</button>
            </div>

            <div class="view-toggle">
                <button class="toggle-btn active" id="btnCardView" onclick="switchView('grid')">🎴 การ์ดรูปภาพ</button>
                <button class="toggle-btn" id="btnTableView" onclick="switchView('table')">📊 ตารางสรุป</button>
            </div>
        </div>

        <!-- GRID VIEW -->
        <div class="grid-view" id="gridView"></div>

        <!-- TABLE VIEW -->
        <div class="table-view" id="tableView">
            <table>
                <thead>
                    <tr>
                        <th style="width: 35px; text-align: center;">#</th>
                        <th style="width: 250px;">ภาพรีวิวจริง (3-4 รูป)</th>
                        <th style="width: 75px;">เมือง</th>
                        <th style="width: 130px;">ย่าน</th>
                        <th style="min-width: 200px;">ชื่อร้าน / สถานที่</th>
                        <th style="width: 95px;">ประเภท</th>
                        <th style="min-width: 170px;">อาหาร / จุดเด่น</th>
                        <th style="width: 120px;">เวลาเปิด-ปิด</th>
                        <th style="min-width: 240px;">เมนูเด็ด / ไฮไลต์</th>
                        <th style="width: 70px; text-align: center;">แผนที่</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

        let currentCity = 'all';
        let currentSearch = '';

        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('open');
        }

        function changeCover(cardId, src, elem) {
            document.getElementById('main-img-' + cardId).src = src;
            const parent = elem.closest('.card-thumbs-strip');
            parent.querySelectorAll('.card-thumb-item').forEach(el => el.classList.remove('active'));
            elem.classList.add('active');
        }

        function render() {
            const filtered = placesData.filter(p => {
                const matchCity = currentCity === 'all' || p.city.toLowerCase() === currentCity.toLowerCase();
                const q = currentSearch.toLowerCase();
                const matchSearch = !q || 
                    p.name.toLowerCase().includes(q) || 
                    p.area.toLowerCase().includes(q) || 
                    p.cuisine.toLowerCase().includes(q) || 
                    p.signature.toLowerCase().includes(q) ||
                    p.note.toLowerCase().includes(q);
                return matchCity && matchSearch;
            });

            // Render Grid
            const grid = document.getElementById('gridView');
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:#718096;font-size:1.05rem;">ไม่พบสถานที่ที่ตรงกับคำค้นหา 🔎</div>';
            } else {
                grid.innerHTML = filtered.map(p => `
                    <div class="place-card">
                        <div class="card-main-img-wrapper" onclick="openModal(document.getElementById('main-img-${p.id}').src)">
                            <img src="${p.cover}" alt="${p.name}" id="main-img-${p.id}" class="card-main-img" loading="lazy">
                            <div class="badge-city">${p.city}</div>
                            <div class="badge-type">${p.type}</div>
                        </div>
                        
                        <div class="card-thumbs-strip">
                            ${p.photos.map((ph, i) => `
                                <img src="${ph}" class="card-thumb-item ${i === 0 ? 'active' : ''}" onclick="changeCover(${p.id}, '${ph}', this)" loading="lazy" title="คลิกเปลี่ยนภาพหน้าปก">
                            `).join('')}
                        </div>

                        <div class="card-body">
                            <div class="card-area">📍 ${p.area}</div>
                            <h3 class="card-title">${p.name}</h3>
                            <div class="card-cuisine">🍽️ ${p.cuisine}</div>
                            <div class="card-hours">⏰ ${p.hours}</div>
                            <div class="card-signature">
                                <strong>เมนูเด็ด:</strong> ${p.signature}
                            </div>
                            ${p.note ? `<div class="card-note">⭐ <strong>โน้ตส่วนตัว:</strong> ${p.note}</div>` : ''}
                            <div class="card-footer">
                                <a href="${p.maps_url}" target="_blank" class="btn-maps">🗺️ แผนที่</a>
                                <a href="${p.photo_search_url}" target="_blank" class="btn-reviews">📷 รูปเพิ่ม</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // Render Table
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td style="text-align: center; font-weight: 600; color: #718096;">${p.id}</td>
                    <td>
                        <div class="tbl-photos-cell">
                            ${p.photos.map(ph => `
                                <img src="${ph}" class="tbl-photo-item" onclick="openModal('${ph}')" loading="lazy" title="คลิกดูภาพขยาย">
                            `).join('')}
                        </div>
                    </td>
                    <td>
                        <span class="tbl-badge badge-${p.city.toLowerCase()}">${p.city}</span>
                    </td>
                    <td style="font-weight: 500;">${p.area}</td>
                    <td style="font-weight: 600; color: #1A365D;">${p.name}</td>
                    <td>${p.type}</td>
                    <td>${p.cuisine}</td>
                    <td style="font-size: 0.8rem; color: #4A5568;">${p.hours}</td>
                    <td>
                        <div>${p.signature}</div>
                        ${p.note ? `<div style="font-size: 0.78rem; color: #C05621; font-weight: 600; margin-top: 3px;">⭐ ${p.note}</div>` : ''}
                    </td>
                    <td style="text-align: center;">
                        <a href="${p.maps_url}" target="_blank" style="text-decoration: none; font-size: 1.2rem;" title="เปิด Google Maps">📍</a>
                    </td>
                </tr>
            `).join('');
        }

        function filterCity(city, btn) {
            currentCity = city;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            render();
        });

        function switchView(mode) {
            const grid = document.getElementById('gridView');
            const table = document.getElementById('tableView');
            const btnCard = document.getElementById('btnCardView');
            const btnTable = document.getElementById('btnTableView');

            if (mode === 'grid') {
                grid.style.display = 'grid';
                table.style.display = 'none';
                btnCard.classList.add('active');
                btnTable.classList.remove('active');
            } else {
                grid.style.display = 'none';
                table.style.display = 'block';
                btnCard.classList.remove('active');
                btnTable.classList.add('active');
            }
        }

        render();
    </script>
</body>
</html>
